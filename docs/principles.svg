<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <filter id="principle-shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="180" rx="12" fill="#0B0F19"/>
  <rect x="1" y="1" width="918" height="178" rx="11" fill="none" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Card 1: User-Centered (#818CF8) -->
  <g transform="translate(18, 16)" filter="url(#principle-shadow)">
    <rect width="210" height="148" rx="12" fill="#111827" stroke="#818CF8" stroke-width="1.2"/>
    <!-- Icon Container -->
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#1E1B4B" stroke="#818CF8" stroke-width="1"/>
    <!-- Terminal CLI Icon -->
    <path d="M 26 28 L 32 34 L 26 40" fill="none" stroke="#818CF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="34" y1="40" x2="42" y2="40" stroke="#818CF8" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Title -->
    <text x="62" y="32" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">User-Centered</text>
    <text x="62" y="46" fill="#818CF8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Frictionless CLI</text>
    <!-- Divider -->
    <line x1="16" y1="62" x2="194" y2="62" stroke="#1F2937" stroke-width="1"/>
    <!-- Description -->
    <text x="16" y="80" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">
      <tspan x="16" dy="0">Intuitive argument flags,</tspan>
      <tspan x="16" dy="16">automatic syntax validation, and</tspan>
      <tspan x="16" dy="16">instant help documentation.</tspan>
    </text>
    <!-- Tag -->
    <rect x="16" y="120" width="80" height="18" rx="4" fill="#1E1B4B"/>
    <text x="56" y="132.5" text-anchor="middle" fill="#A5B4FC" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">CLI Usability</text>
  </g>

  <!-- Card 2: Minimal & Clean (#34D399) -->
  <g transform="translate(242, 16)" filter="url(#principle-shadow)">
    <rect width="210" height="148" rx="12" fill="#111827" stroke="#34D399" stroke-width="1.2"/>
    <!-- Icon Container -->
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#064E3B" stroke="#34D399" stroke-width="1"/>
    <!-- Clean Sparkle / Layer Icon -->
    <path d="M 34 22 L 36 29 L 43 31 L 36 33 L 34 40 L 32 33 L 25 31 L 32 29 Z" fill="#34D399"/>
    <!-- Title -->
    <text x="62" y="32" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Minimal &amp; Clean</text>
    <text x="62" y="46" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Zero Runtime Bloat</text>
    <!-- Divider -->
    <line x1="16" y1="62" x2="194" y2="62" stroke="#1F2937" stroke-width="1"/>
    <!-- Description -->
    <text x="16" y="80" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">
      <tspan x="16" dy="0">Pure POSIX-compliant Bash</tspan>
      <tspan x="16" dy="16">execution with zero external</tspan>
      <tspan x="16" dy="16">runtime or library overhead.</tspan>
    </text>
    <!-- Tag -->
    <rect x="16" y="120" width="76" height="18" rx="4" fill="#064E3B"/>
    <text x="54" y="132.5" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">Pure Bash</text>
  </g>

  <!-- Card 3: Consistent (#EC4899) -->
  <g transform="translate(466, 16)" filter="url(#principle-shadow)">
    <rect width="210" height="148" rx="12" fill="#111827" stroke="#EC4899" stroke-width="1.2"/>
    <!-- Icon Container -->
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#500724" stroke="#EC4899" stroke-width="1"/>
    <!-- Grid / Layout Icon -->
    <rect x="25" y="24" width="8" height="8" rx="2" fill="none" stroke="#EC4899" stroke-width="1.6"/>
    <rect x="35" y="24" width="8" height="8" rx="2" fill="none" stroke="#EC4899" stroke-width="1.6"/>
    <rect x="25" y="34" width="8" height="8" rx="2" fill="none" stroke="#EC4899" stroke-width="1.6"/>
    <rect x="35" y="34" width="8" height="8" rx="2" fill="none" stroke="#EC4899" stroke-width="1.6"/>
    <!-- Title -->
    <text x="62" y="32" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Consistent</text>
    <text x="62" y="46" fill="#EC4899" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Deterministic Scans</text>
    <!-- Divider -->
    <line x1="16" y1="62" x2="194" y2="62" stroke="#1F2937" stroke-width="1"/>
    <!-- Description -->
    <text x="16" y="80" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">
      <tspan x="16" dy="0">Standardized timing templates,</tspan>
      <tspan x="16" dy="16">predictable probe order, and</tspan>
      <tspan x="16" dy="16">uniform output naming schemas.</tspan>
    </text>
    <!-- Tag -->
    <rect x="16" y="120" width="82" height="18" rx="4" fill="#500724"/>
    <text x="57" y="132.5" text-anchor="middle" fill="#F472B6" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">Deterministic</text>
  </g>

  <!-- Card 4: Accessible (#38BDF8) -->
  <g transform="translate(690, 16)" filter="url(#principle-shadow)">
    <rect width="210" height="148" rx="12" fill="#111827" stroke="#38BDF8" stroke-width="1.2"/>
    <!-- Icon Container -->
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1"/>
    <!-- File / Document ETL Icon -->
    <rect x="26" y="24" width="16" height="20" rx="2" fill="none" stroke="#38BDF8" stroke-width="1.6"/>
    <line x1="30" y1="30" x2="38" y2="30" stroke="#38BDF8" stroke-width="1.4"/>
    <line x1="30" y1="35" x2="38" y2="35" stroke="#38BDF8" stroke-width="1.4"/>
    <!-- Title -->
    <text x="62" y="32" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Accessible</text>
    <text x="62" y="46" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Universal ETL</text>
    <!-- Divider -->
    <line x1="16" y1="62" x2="194" y2="62" stroke="#1F2937" stroke-width="1"/>
    <!-- Description -->
    <text x="16" y="80" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">
      <tspan x="16" dy="0">SIEM-friendly structured XML,</tspan>
      <tspan x="16" dy="16">plaintext terminal streams, and</tspan>
      <tspan x="16" dy="16">POSIX pipe integration.</tspan>
    </text>
    <!-- Tag -->
    <rect x="16" y="120" width="76" height="18" rx="4" fill="#0C4A6E"/>
    <text x="54" y="132.5" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">Universal ETL</text>
  </g>
</svg>
