<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="grid-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <marker id="arrow-head-right" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-head-left" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 9 1 L 0 5 L 9 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="300" rx="14" fill="#0B0F19"/>
  <rect x="1" y="1" width="918" height="298" rx="13" fill="none" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Card 1: Security Analyst / CLI (#BFDBFE Light Blue) -->
  <g transform="translate(24, 40)" filter="url(#card-shadow)">
    <rect width="180" height="220" rx="12" fill="#BFDBFE"/>
    <circle cx="90" cy="48" r="22" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
    <!-- Terminal / Prompt Icon -->
    <path d="M 82 43 L 88 48 L 82 53" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="90" y1="53" x2="98" y2="53" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Text Elements -->
    <text x="90" y="94" text-anchor="middle" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">SecOps Analyst</text>
    <text x="90" y="112" text-anchor="middle" fill="#1E3A8A" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Terminal CLI Client</text>
    <line x1="20" y1="126" x2="160" y2="126" stroke="#93C5FD" stroke-width="1"/>
    <!-- Pill 1 -->
    <rect x="22" y="140" width="136" height="26" rx="6" fill="#FFFFFF"/>
    <text x="90" y="157" text-anchor="middle" fill="#1E3A8A" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">Bash Command CLI</text>
    <!-- Pill 2 -->
    <rect x="22" y="174" width="136" height="26" rx="6" fill="#FFFFFF"/>
    <text x="90" y="191" text-anchor="middle" fill="#1E3A8A" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">Flags (-t/-m/-o)</text>
  </g>

  <!-- Arrow 1: CLI <-> Scan Orchestrator -->
  <g transform="translate(204, 150)">
    <line x1="8" y1="0" x2="44" y2="0" stroke="#64748B" stroke-width="2" marker-start="url(#arrow-head-left)" marker-end="url(#arrow-head-right)"/>
    <rect x="10" y="-22" width="32" height="15" rx="3" fill="#1E293B"/>
    <text x="26" y="-11" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">EXEC</text>
    <text x="26" y="16" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">Args</text>
  </g>

  <!-- Card 2: Orchestration Engine (#A7F3D0 Light Green) -->
  <g transform="translate(256, 40)" filter="url(#card-shadow)">
    <rect width="180" height="220" rx="12" fill="#A7F3D0"/>
    <circle cx="90" cy="48" r="22" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
    <!-- Script / Dispatcher Icon -->
    <rect x="79" y="38" width="22" height="20" rx="3" fill="none" stroke="#0F172A" stroke-width="1.8"/>
    <line x1="83" y1="44" x2="97" y2="44" stroke="#0F172A" stroke-width="1.6"/>
    <line x1="83" y1="49" x2="93" y2="49" stroke="#0F172A" stroke-width="1.6"/>
    <!-- Text Elements -->
    <text x="90" y="94" text-anchor="middle" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Scan Dispatcher</text>
    <text x="90" y="112" text-anchor="middle" fill="#065F46" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Modular Bash (scan.sh)</text>
    <line x1="20" y1="126" x2="160" y2="126" stroke="#6EE7B7" stroke-width="1"/>
    <!-- Pill 1 -->
    <rect x="22" y="140" width="136" height="26" rx="6" fill="#FFFFFF"/>
    <text x="90" y="157" text-anchor="middle" fill="#065F46" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">Pre-flight Checks</text>
    <!-- Pill 2 -->
    <rect x="22" y="174" width="136" height="26" rx="6" fill="#FFFFFF"/>
    <text x="90" y="191" text-anchor="middle" fill="#065F46" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">Mode Matrix (Q/N/F)</text>
  </g>

  <!-- Arrow 2: Dispatcher <-> Nmap Core -->
  <g transform="translate(436, 150)">
    <line x1="8" y1="0" x2="44" y2="0" stroke="#64748B" stroke-width="2" marker-start="url(#arrow-head-left)" marker-end="url(#arrow-head-right)"/>
    <rect x="8" y="-22" width="36" height="15" rx="3" fill="#1E293B"/>
    <text x="26" y="-11" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">PROBE</text>
    <text x="26" y="16" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">Sockets</text>
  </g>

  <!-- Card 3: Nmap Reconnaissance Engine (#FDE68A Light Yellow) -->
  <g transform="translate(488, 40)" filter="url(#card-shadow)">
    <rect width="180" height="220" rx="12" fill="#FDE68A"/>
    <circle cx="90" cy="48" r="22" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
    <!-- Radar / Network Scan Icon -->
    <circle cx="90" cy="48" r="10" fill="none" stroke="#0F172A" stroke-width="1.8"/>
    <line x1="90" y1="48" x2="98" y2="40" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
    <!-- Text Elements -->
    <text x="90" y="94" text-anchor="middle" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Nmap Recon Engine</text>
    <text x="90" y="112" text-anchor="middle" fill="#92400E" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Service &amp; Port Probing</text>
    <line x1="20" y1="126" x2="160" y2="126" stroke="#FCD34D" stroke-width="1"/>
    <!-- Pill 1 -->
    <rect x="22" y="140" width="136" height="26" rx="6" fill="#FFFFFF"/>
    <text x="90" y="157" text-anchor="middle" fill="#92400E" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">SYN / TCP (-sS -T4)</text>
    <!-- Pill 2 -->
    <rect x="22" y="174" width="136" height="26" rx="6" fill="#FFFFFF"/>
    <text x="90" y="191" text-anchor="middle" fill="#92400E" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">OS &amp; NSE Scripts (-sC)</text>
  </g>

  <!-- Arrow 3: Nmap Core <-> Report Pipeline -->
  <g transform="translate(668, 150)">
    <line x1="8" y1="0" x2="44" y2="0" stroke="#64748B" stroke-width="2" marker-start="url(#arrow-head-left)" marker-end="url(#arrow-head-right)"/>
    <rect x="9" y="-22" width="34" height="15" rx="3" fill="#1E293B"/>
    <text x="26" y="-11" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600">STORE</text>
    <text x="26" y="16" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">Stream</text>
  </g>

  <!-- Card 4: Structured Reporting & ETL (#DDD6FE Light Purple) -->
  <g transform="translate(716, 40)" filter="url(#card-shadow)">
    <rect width="180" height="220" rx="12" fill="#DDD6FE"/>
    <circle cx="90" cy="48" r="22" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
    <!-- Document / Report Icon -->
    <rect x="80" y="38" width="20" height="22" rx="2.5" fill="none" stroke="#0F172A" stroke-width="1.8"/>
    <line x1="84" y1="44" x2="96" y2="44" stroke="#0F172A" stroke-width="1.6"/>
    <line x1="84" y1="49" x2="96" y2="49" stroke="#0F172A" stroke-width="1.6"/>
    <line x1="84" y1="54" x2="92" y2="54" stroke="#0F172A" stroke-width="1.6"/>
    <!-- Text Elements -->
    <text x="90" y="94" text-anchor="middle" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Audit Reports</text>
    <text x="90" y="112" text-anchor="middle" fill="#5B21B6" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Structured Artifacts</text>
    <line x1="20" y1="126" x2="160" y2="126" stroke="#C4B5FD" stroke-width="1"/>
    <!-- Pill 1 -->
    <rect x="22" y="140" width="136" height="26" rx="6" fill="#FFFFFF"/>
    <text x="90" y="157" text-anchor="middle" fill="#5B21B6" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">Timestamped TXT</text>
    <!-- Pill 2 -->
    <rect x="22" y="174" width="136" height="26" rx="6" fill="#FFFFFF"/>
    <text x="90" y="191" text-anchor="middle" fill="#5B21B6" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">Machine-Readable XML</text>
  </g>
</svg>
